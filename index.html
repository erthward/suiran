<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Hina+Mincho&display=swap" rel="stylesheet">
<title>Vocab</title>
<style>
:root{--bg:#fff;--fg:#000;--mut:#777;--card:#fff;--ac:#000;--bd:#ddd;--g:#178d7f;--r:#a02e60}
@media(prefers-color-scheme:dark){:root{--bg:#000;--fg:#fff;--ac:#fff;--mut:#999;--card:#111;--bd:#333}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif}
/* handwriting-style Japanese: change "Klee One" to "Yuji Syuku" (brush) or "Zen Kurenaido" (handwriting) to try others */
#sw,#sr,.item span,input,textarea{font-family:"Klee One","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif}
.screen{display:none;height:100%;padding:16px;flex-direction:column;gap:12px;overflow-y:auto}
.screen.on{display:flex}
button,input,textarea{font:inherit;color:inherit}
.big{flex:1;font-size:1.6rem;border:2px solid var(--bd);background:var(--card);border-radius:16px}
.big.p{background:var(--ac);border-color:var(--ac);color:var(--bg)}
.btn{padding:12px 16px;border:1px solid var(--bd);background:var(--card);border-radius:10px}
.btn.p{background:var(--ac);border-color:var(--ac);color:var(--bg)}
#title{text-align:center;font-size:3.6rem;letter-spacing:.08em;padding:8px 0;font-family:"Hina Mincho","Klee One",serif}
#title span{color:var(--fg)}
#title .g{text-shadow:0 0 12px var(--g),1px 1px 0 var(--g)}#title .r{text-shadow:0 0 12px var(--r),1px 1px 0 var(--r)}
#flash span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:40vmin;font-family:"Hina Mincho","Klee One",serif;opacity:.5}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:5}
#flash.go{animation:fl 1s ease-out}
@keyframes fl{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
.back{align-self:flex-start;border:0;background:none;color:var(--mut);font-size:1rem;padding:4px 0}
input,textarea{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);font-size:1.1rem}
label{font-size:.8rem;color:var(--mut)}
#card{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--card);border:1px solid var(--bd);border-radius:20px;text-align:center;padding:20px;touch-action:pan-y;user-select:none}
#sw{font-size:3.2rem;word-break:break-all}#sr{font-size:1.6rem;color:var(--mut)}#sd{font-size:1.25rem;white-space:pre-wrap}
#hint{color:var(--mut);font-size:.85rem}
.row{display:flex;gap:8px}.row .btn{flex:1}
.item{display:flex;justify-content:space-between;gap:10px;padding:10px 4px;border-bottom:1px solid var(--bd)}
.item small{color:var(--mut);display:block}.pct{white-space:nowrap;color:var(--mut)}
#toast{position:fixed;left:16px;right:16px;bottom:24px;background:var(--fg);color:var(--bg);padding:12px;border-radius:10px;text-align:center;display:none}
</style></head><body>

<div id="home" class="screen on">
  <div id="title"><span class="g">翠</span><span class="r">嵐</span></div>
  <button class="big" onclick="openAdd()">Add</button>
  <button class="big" onclick="openReview()">Review</button>
  <button class="big p" onclick="openStudy()">Study</button>
</div>

<div id="add" class="screen">
  <button class="back" onclick="show('home')">‹ Home</button>
  <input id="fw" placeholder="Word" autocomplete="off" onkeydown="if(event.key==='Enter')lookup(false)">
  <button class="btn" id="lk" onclick="lookup(false)">Look up</button>
  <div id="msg" style="color:var(--r);font-size:.9rem"></div>
  <div id="fields" style="display:none;flex-direction:column;gap:12px">
    <div><label>Reading</label><input id="fr"></div>
    <div><label>Definition / notes (shown on 2nd tap)</label><textarea id="fd" rows="4"></textarea></div>
    <div class="row"><button class="btn" onclick="cancelForm()">Cancel</button><button class="btn" id="rt" onclick="lookup(true)">Retry lookup</button><button class="btn p" onclick="saveForm()">Save</button></div>
  </div>
</div>

<div id="review" class="screen">
  <button class="back" onclick="show('home')">‹ Home</button>
  <div id="list"></div>
  <div class="row"><button class="btn" onclick="exportData()">Export</button><button class="btn" onclick="document.getElementById('imp').click()">Import</button></div>
  <input type="file" id="imp" accept=".json" style="display:none" onchange="importData(this)">
</div>

<div id="study" class="screen">
  <button class="back" onclick="show('home')">‹ Home</button>
  <div id="card"><div id="sw"></div><div id="sr"></div><div id="sd"></div><div id="hint"></div></div>
  <div class="row" id="ans" style="visibility:hidden">
    <button class="btn" style="color:var(--g)" onclick="answer(true)">← Got it</button>
    <button class="btn" onclick="editCur()">Edit</button>
    <button class="btn" style="color:var(--r)" onclick="answer(false)">Missed →</button>
  </div>
</div>
<div id="flash"></div>
<div id="toast"></div>

<script>
const SEED=`調整; 調子; 凸凹; 過ぎる; 頬, 頰; 痩せる, 瘠せる; さすが, 流石, 遉, 有繋; 候補; ほら, ほれ; 決して; 加える; なにやら, 何やら; おまけに, お負けに, 御負けに; 継ぐ, 嗣ぐ, 続ぐ, 襲ぐ; 顎, 頤, 腭; 特徴; サンゴ礁, 珊瑚礁; 沼; 雰囲気; 混入; 乱れ, 紊れ; 初対面; 賑やか; 押さえる, 押える; 畳; 狸の金玉八畳敷き, 狸の睾丸八畳敷き; 見渡す, 見わたす; 家庭; 玄関; ベニヤ, ベニア; しーん, しいん; 了解, 諒解, 領解, 領会; 開始; 終了; 呼吸; のち, 後; 揺れる; 設置; 点滅; 蛍光灯; 急速; 当たり前, 当り前; 暮れる, 昏れる, 眩れる, 暗れる; 異なる, 異る; 興味深い, 興味ぶかい; 帰る, 還る; 運動; 納得; 芸人; 軍団; 一晩中; 一晩, ひと晩; 拝見, 拜見; 拝む; のみ; 肉親; 高齢; 大家, 大屋; 実は; 実に; 実; 混じる, 交じる, 雑じる; いつまでも, 何時までも; わびしい, 侘しい, 侘びしい; それにしても; ずれる, ズレる; ずれ; 持ち主, 持主; 異; くぐる, 潜る; 超過; 響き, 響; 響く; 影響; だろう, だろ; 裕福; 多く; 住宅; 質素; 質; 向け; 一目, ひと目; 内心; 務まる, 勤まる; 視線; 添える, 副える; 移る, 遷る; 扱う; たくましい, 逞しい; 束ねる; 束, 把; ばら, 薔薇; 初老; がっしり; 渋い; 釣り, 釣; お釣り, お釣; 釣る; ひよどり, 鵯, ひよ鳥; 店頭; 思い切り, 思いきり; 思い切る; とっさに, 咄嗟に; かかる, 罹る; 派手; 夢想; 通じる; 現在, 見在; あふれる, 溢れる; 泉; 飴; 空間; 歪む; 一歩, １歩; 保存; ありふれた, 有り触れた; 語句; 句読点; 句; 文句; 俳句; 俳人; まず, 先ず; 許し, 赦し; これで; かつて, 嘗て, 曽て, 都て; 表す, 現す, 表わす, 現わす, 顕す; 暮らす, 暮す; 遮断; 呆然, 茫然, 惘然; 全く; 余る; 早速; 改めて; 痛む, 傷む; 胸; 一体; 改める; 日々, 日日; 天邪鬼, 天の邪鬼, 天ん邪鬼, 天之邪鬼, 天邪久; 求める; として; 結局; といっても, と言っても; 抱える; いくら, 幾ら; にらむ, 睨む; 谷間, 谷あい; 性に合う; 在宅; 収入; すでに, 既に, 已に; 相手; 市民; 生計; 一室; 退職; ほど, 程; 同僚; 編む; 編集, 編修, 編輯; 出版, 出板`;
//const WORKER_URL='https://suiran-jisho.ihavehands.workers.dev'; // paste your Cloudflare Worker URL here, e.g. https://suiran-jisho.yourname.workers.dev
const WORKER_URL='https://fresh-rat-4711.ihavehands.deno.net'; // paste your Deno Worker URL here, e.g. https://suiran-jisho.yourname.workers.dev
const K='vocab1',$=id=>document.getElementById(id);
const mk=(w,alts)=>({id:Date.now()+Math.random(),w,alts:alts||'',r:'',d:'',tried:false,right:0,wrong:0,streak:0,due:0});
let cards=JSON.parse(localStorage.getItem(K)||'null');
if(!cards){cards=SEED.split(';').map(s=>s.trim()).filter(Boolean).map(s=>{const p=s.split(',').map(x=>x.trim());return mk(p[0],p.slice(1).join(', '))});save()}
function save(){localStorage.setItem(K,JSON.stringify(cards))}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id))}
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2500)}
const pct=c=>{const n=c.right+c.wrong;return n?c.right/n*100:-1};

// ---- Jisho ----
async function jisho(forms){
  const k=encodeURIComponent(forms[0]);
  const res=await fetch(WORKER_URL?WORKER_URL+'?keyword='+k:'https://jisho.org/api/v1/search/words?keyword='+k);
  if(!res.ok)throw new Error('HTTP '+res.status);
  const j=await res.json();
  const m=x=>forms.includes(x.word)||forms.includes(x.reading);
  const hit=j.data.find(e=>e.japanese.some(m));
  if(!hit)return null;
  const jp=hit.japanese.find(m);
  return{r:jp.reading||'',d:hit.senses.slice(0,2).map(s=>s.english_definitions.slice(0,3).join(', ')).join('; ')};
}
const formsOf=c=>[c.w,...(c.alts?c.alts.split(',').map(x=>x.trim()):[])];

// ---- Add / edit ----
let editing=null;
function openAdd(){$('msg').textContent='';editing=null;$('fw').value='';$('fw').disabled=false;$('fr').value='';$('fd').value='';$('fields').style.display='none';$('lk').style.display='';show('add');$('fw').focus()}
async function lookup(retry){
  const w=$('fw').value.trim();if(!w)return;
  const btn=retry?$('rt'):$('lk'),lab=btn.textContent;
  btn.disabled=true;btn.textContent='…';
  try{
    const r=await jisho([w]);
    // on retry, only fill fields you haven't already typed into
    if(!retry||!$('fr').value)$('fr').value=r?r.r:$('fr').value;
    if(!retry||!$('fd').value)$('fd').value=r?r.d:$('fd').value;
    $('msg').textContent=r?'':'Not found on Jisho — type your own, or cancel.';
    $('fields').style.display='flex';$('lk').style.display='none';
  }catch(e){$('msg').textContent='Couldn’t reach Jisho ('+(e&&e.message?e.message:e)+'). Retry, fill in manually, or cancel.';$('fields').style.display='flex';$('lk').style.display='none'}
  btn.disabled=false;btn.textContent=lab;
}
function saveForm(){
  const w=$('fw').value.trim();if(!w)return;
  let c=editing||cards.find(x=>x.w===w);
  if(!c){c=mk(w);cards.push(c)}
  c.r=$('fr').value.trim();c.d=$('fd').value.trim();c.tried=true;
  save();toast('Saved');editing=null;
  if(returnTo==='study'){show('study');render()}else show('home');
  returnTo=null;
}
let returnTo=null;
function cancelForm(){editing=null;if(returnTo==='study'){show('study');render()}else show('home');returnTo=null}
function editCard(c,from){
  $('msg').textContent='';editing=c;returnTo=from;$('fw').value=c.w;$('fw').disabled=true;$('fr').value=c.r;$('fd').value=c.d;
  $('fields').style.display='flex';$('lk').style.display='none';show('add');
}

// ---- Review ----
function openReview(){
  const s=[...cards].sort((a,b)=>pct(a)-pct(b));
  $('list').innerHTML='';
  s.forEach(c=>{
    const d=document.createElement('div');d.className='item';
    const p=pct(c);
    d.innerHTML='<div><span></span><small></small></div><div class="pct">'+(p<0?'–':Math.round(p)+'%')+'</div>';
    d.querySelector('span').textContent=c.w+(c.r&&c.r!==c.w?'  ('+c.r+')':'');
    d.querySelector('small').textContent=c.d;
    d.onclick=()=>editCard(c,null);
    $('list').appendChild(d);
  });
  show('review');
}
function exportData(){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(cards)],{type:'application/json'}));
  a.download='vocab-backup.json';a.click();
}
function importData(i){
  const f=i.files[0];if(!f)return;
  f.text().then(t=>{try{const d=JSON.parse(t);if(!Array.isArray(d))throw 0;if(confirm('Replace all data with this backup?')){cards=d;save();openReview()}}catch(e){toast('Bad file')}});
  i.value='';
}

// ---- Study ----
let cur=null,stage=0,last=null;
function openStudy(){show('study');next()}
function next(){
  const now=Date.now();
  let pool=cards.filter(c=>c.due<=now&&c.id!==last);
  if(!pool.length)pool=cards.filter(c=>c.id!==last).sort((a,b)=>a.due-b.due).slice(0,5);
  if(!pool.length)pool=cards;
  if(!pool.length){$('sw').textContent='No cards yet';return}
  const wt=pool.map(c=>{const p=pct(c);return 1+(p<0?2:(1-p/100)*3)});
  let r=Math.random()*wt.reduce((a,b)=>a+b,0),i=0;
  while(r>wt[i]&&i<pool.length-1){r-=wt[i];i++}
  cur=pool[i];stage=0;render();
  if(!cur.tried&&!cur.d){cur.tried=true;const c=cur;
    jisho(formsOf(c)).then(r=>{if(r){c.r=c.r||r.r;c.d=c.d||r.d;save();if(cur===c)render()}}).catch(()=>{c.tried=false});}
}
function render(){
  if(!cur)return;
  const hasF=cur.r&&cur.r!==cur.w;
  $('sw').textContent=cur.w;
  $('sr').textContent=stage>=1&&hasF?cur.r:'';
  $('sd').textContent=stage>=2?(cur.d||'(no definition — tap Edit)'):'';
  $('hint').textContent=stage<2?'tap to reveal  ·  or swipe':'← got it  ·  missed →';
  $('ans').style.visibility=stage>=2?'visible':'hidden';
}
function advance(){
  if(!cur||stage>=2)return;
  const hasF=cur.r&&cur.r!==cur.w;
  stage=(stage===0&&hasF)?1:2;render();
}
const IV=[1,2,4,8,16,32,64,120];
function answer(ok){
  if(!cur)return;
  if(ok){cur.right++;cur.streak++}else{cur.wrong++;cur.streak=0}
  cur.due=Date.now()+(cur.streak===0?5*60e3:IV[Math.min(cur.streak-1,7)]*864e5);
  last=cur.id;save();
  const f=$('flash');f.innerHTML='<span style="color:'+(ok?'#178d7f':'#a02e60')+'">'+(ok?'翠':'嵐')+'</span>';f.style.background='radial-gradient(circle at 50% 50%,'+(ok?'rgba(23,141,127,.55)':'rgba(160,46,96,.55)')+' 0%,'+(ok?'rgba(23,141,127,.25)':'rgba(160,46,96,.25)')+' 55%,transparent 100%)';f.classList.remove('go');void f.offsetWidth;f.classList.add('go');
  const c=$('card');c.style.transition='transform .15s,opacity .15s';c.style.transform='translateX('+(ok?'-':'')+'100vw)';c.style.opacity=0;
  setTimeout(()=>{c.style.transition='none';c.style.transform='';c.style.opacity=1;next()},160);
}
function editCur(){if(cur)editCard(cur,'study')}
(function(){
  const c=$('card');let x0=null,dx=0;
  c.addEventListener('pointerdown',e=>{x0=e.clientX;dx=0;c.setPointerCapture(e.pointerId);c.style.transition='none'});
  c.addEventListener('pointermove',e=>{if(x0===null)return;dx=e.clientX-x0;if(Math.abs(dx)>10)c.style.transform='translateX('+dx+'px)'});
  c.addEventListener('pointerup',()=>{
    if(x0===null)return;x0=null;
    if(Math.abs(dx)<10){c.style.transform='';advance()}
    else if(Math.abs(dx)>90)answer(dx<0);
    else c.style.transform='';
  });
  c.addEventListener('pointercancel',()=>{x0=null;c.style.transform=''});
})();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
